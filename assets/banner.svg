<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a11" />
      <stop offset="50%" stop-color="#0d111e" />
      <stop offset="100%" stop-color="#06080e" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigo-glow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; letter-spacing: -0.01em; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; font-size: 13px; fill: #e2e8f0; letter-spacing: 0.02em; }
    .metric-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 24px; fill: #ffffff; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="20" fill="url(#bg-grad)" />
  <rect width="1200" height="440" rx="20" fill="url(#dot-grid)" />
  <rect width="1200" height="440" rx="20" fill="url(#cyan-glow)" />
  <rect width="1200" height="440" rx="20" fill="url(#indigo-glow)" />

  <!-- Outer Border -->
  <rect width="1198" height="438" x="1" y="1" rx="19" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Content Container -->
  <g transform="translate(60, 60)">
    
    <!-- Status Tag -->
    <g transform="translate(0, 0)">
      <rect width="196" height="28" rx="14" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="18" class="badge-text" fill="#34d399" font-size="11">OPEN SOURCE ENTERPRISE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 70)">
      <text class="title" fill="url(#title-grad)">OmniWA-Agent</text>
      <text x="0" y="44" class="subtitle">The Enterprise-Calibrated WhatsApp AI Agent That Refuses to Get Banned or Hallucinate</text>
    </g>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: Baileys -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="badge-text">⚡ Baileys WebSocket</text>
      </g>
      <!-- Pill 2: ChromaDB -->
      <g transform="translate(192, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="badge-text">🧠 ChromaDB Vector RAG</text>
      </g>
      <!-- Pill 3: Anti-Hallucination -->
      <g transform="translate(384, 0)">
        <rect width="190" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="badge-text">🛡️ Zero-Hallucination</text>
      </g>
      <!-- Pill 4: Escalation -->
      <g transform="translate(586, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="badge-text">🚨 ITIL 4-Tier Crisis</text>
      </g>
      <!-- Pill 5: PWA -->
      <g transform="translate(778, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="badge-text">🖥️ PWA Admin Console</text>
      </g>
    </g>

    <!-- Key Metrics / Highlights Box -->
    <g transform="translate(0, 225)">
      <!-- Box 1 -->
      <g transform="translate(0, 0)">
        <rect width="250" height="74" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />
        <text x="20" y="36" class="metric-value">~50 MB</text>
        <text x="20" y="56" class="metric-label">RAM Footprint (No Chrome)</text>
      </g>
      <!-- Box 2 -->
      <g transform="translate(270, 0)">
        <rect width="250" height="74" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />
        <text x="20" y="36" class="metric-value">15–25 ms</text>
        <text x="20" y="56" class="metric-label">Gaussian Typing Jitter</text>
      </g>
      <!-- Box 3 -->
      <g transform="translate(540, 0)">
        <rect width="250" height="74" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />
        <text x="20" y="36" class="metric-value">1-Click</text>
        <text x="20" y="56" class="metric-label">Docker &amp; Native Deploy</text>
      </g>
      <!-- Box 4 -->
      <g transform="translate(810, 0)">
        <rect width="270" height="74" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />
        <text x="20" y="36" class="metric-value">100% Free</text>
        <text x="20" y="56" class="metric-label">Open Source (MIT License)</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <style>
      .mono-title { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 40px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.03em; }
      .mono-sub { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 15px; fill: #94a3b8; }
      .node-text { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #f1f5f9; text-anchor: middle; }
      .node-sub { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .stat-lbl { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="#090b10" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <rect width="1198" height="358" x="1" y="1" rx="8" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <text x="0" y="32" class="mono-title">omni-wa-agent</text>
    <text x="310" y="24" class="mono-sub" fill="#38bdf8" font-size="12">[v1.0.0 · MIT]</text>
    <text x="0" y="62" class="mono-sub">Headless WhatsApp AI agent runtime with ~50MB RAM footprint, vector RAG, and keystroke pacing.</text>
  </g>

  <!-- Architecture Pipeline Diagram (Boxes 155px wide, centered text) -->
  <g transform="translate(60, 145)">
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="155" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="77" y="28" class="node-text">Baileys WS</text>
      <text x="77" y="47" class="node-sub">Native WS (~50MB)</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="160" y1="32" x2="185" y2="32" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Box 2 -->
    <g transform="translate(190, 0)">
      <rect width="155" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="77" y="28" class="node-text">FIFO Queue</text>
      <text x="77" y="47" class="node-sub">Per-sender mutex</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="350" y1="32" x2="375" y2="32" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Box 3 -->
    <g transform="translate(380, 0)">
      <rect width="155" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="77" y="28" class="node-text">Normalizer</text>
      <text x="77" y="47" class="node-sub">Slang expansion</text>
    </g>

    <!-- Arrow 3 -->
    <line x1="540" y1="32" x2="565" y2="32" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Box 4 -->
    <g transform="translate(570, 0)">
      <rect width="155" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="77" y="28" class="node-text">ChromaDB</text>
      <text x="77" y="47" class="node-sub">Vector Markdown RAG</text>
    </g>

    <!-- Arrow 4 -->
    <line x1="730" y1="32" x2="755" y2="32" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Box 5 -->
    <g transform="translate(760, 0)">
      <rect width="155" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="77" y="28" class="node-text">LLM Inference</text>
      <text x="77" y="47" class="node-sub">Multi-Provider Engine</text>
    </g>

    <!-- Arrow 5 -->
    <line x1="920" y1="32" x2="945" y2="32" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Box 6 -->
    <g transform="translate(950, 0)">
      <rect width="130" height="64" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="65" y="28" class="node-text" fill="#34d399">Pacing Jitter</text>
      <text x="65" y="47" class="node-sub">15–25ms/char</text>
    </g>
  </g>

  <!-- Technical Benchmarks Row -->
  <g transform="translate(60, 245)">
    <!-- Stat 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="20" class="stat-val">~50 MB</text>
      <text x="0" y="40" class="stat-lbl">RAM Footprint (RSS)</text>
    </g>
    <!-- Line separator -->
    <line x1="220" y1="5" x2="220" y2="45" stroke="#1e293b" stroke-width="1" />

    <!-- Stat 2 -->
    <g transform="translate(260, 0)">
      <text x="0" y="20" class="stat-val">15–25 ms</text>
      <text x="0" y="40" class="stat-lbl">Keystroke Jitter (Gaussian)</text>
    </g>
    <!-- Line separator -->
    <line x1="500" y1="5" x2="500" y2="45" stroke="#1e293b" stroke-width="1" />

    <!-- Stat 3 -->
    <g transform="translate(540, 0)">
      <text x="0" y="20" class="stat-val">20 / 20</text>
      <text x="0" y="40" class="stat-lbl">Adversarial Tests Passed</text>
    </g>
    <!-- Line separator -->
    <line x1="770" y1="5" x2="770" y2="45" stroke="#1e293b" stroke-width="1" />

    <!-- Stat 4 -->
    <g transform="translate(810, 0)">
      <text x="0" y="20" class="stat-val">Zero Chrome</text>
      <text x="0" y="40" class="stat-lbl">Pure WebSocket Architecture</text>
    </g>
  </g>
</svg>
